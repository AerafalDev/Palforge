version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "System.Reflection.MetadataLoadContext"]
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/docs"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(deps)"
    groups:
      # Packages that must move together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      fumadocs:
        patterns: ["fumadocs-*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      docs-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next still bundles plugins that only support ESLint 9.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Next.js and typescript-eslint do not support the native TypeScript 7 compiler yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # Track the floating major tag (@v4) instead of pinning every minor/patch release.
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
