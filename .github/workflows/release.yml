name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    bundle:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Publish proxy
              run: dotnet publish src/Palforge.Proxy/Palforge.Proxy.csproj --configuration Release --runtime win-x64 --output publish/proxy

            - name: Publish runtime
              run: dotnet publish src/Palforge/Palforge.csproj --configuration Release --runtime win-x64 --self-contained true -p:EnableDynamicLoading=true -p:UseAppHost=false --output publish/core

            - name: Assemble server bundle
              shell: pwsh
              run: |
                  $win64 = "bundle/Win64"
                  $palforge = "$win64/Palforge"
                  New-Item -ItemType Directory -Force -Path "$palforge/Core", "$palforge/Logs", "$palforge/Plugins" | Out-Null

                  Copy-Item "publish/proxy/version.dll" "$win64/version.dll"
                  Copy-Item "publish/core/*" "$palforge/Core" -Recurse -Force
                  Copy-Item "src/Palforge/Resources/Configuration/Configuration.toml" "$palforge/Configuration.toml"

                  Set-Content "$palforge/Logs/.keep" ""
                  Set-Content "$palforge/Plugins/README.txt" "Place each plugin in its own folder here: Plugins\<Name>\<Name>.dll (with its <Name>.cfg beside it)."

            - name: Zip
              shell: pwsh
              run: Compress-Archive -Path "bundle/Win64/*" -DestinationPath "Palforge-${{ github.ref_name }}-win-x64.zip"

            - name: Attach to the GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  files: Palforge-${{ github.ref_name }}-win-x64.zip
                  generate_release_notes: true