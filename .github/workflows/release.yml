name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to release (e.g. v1.2.3)."
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: true

jobs:
    bundle:
        runs-on: windows-latest

        env:
            RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - configuration: Release
                      suffix: ""
                    - configuration: Debug
                      suffix: "-debug"

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag || github.ref_name }}

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x

            - name: Publish proxy
              run: dotnet publish src/Palforge.Proxy/Palforge.Proxy.csproj --configuration ${{ matrix.configuration }} --runtime win-x64 --output publish/proxy

            - name: Publish runtime
              run: dotnet publish src/Palforge/Palforge.csproj --configuration ${{ matrix.configuration }} --runtime win-x64 --self-contained true -p:EnableDynamicLoading=true -p:UseAppHost=false --output publish/core

            - name: Assemble server bundle
              shell: pwsh
              run: |
                  $win64 = "bundle/Win64"
                  $palforge = "$win64/Palforge"
                  New-Item -ItemType Directory -Force -Path "$palforge/Core", "$palforge/Logs", "$palforge/Plugins" | Out-Null

                  Copy-Item "publish/proxy/version.dll" "$win64/version.dll"
                  Copy-Item "publish/core/*" "$palforge/Core" -Recurse -Force
                  Copy-Item "src/Palforge/Resources/Configuration/Configuration.cfg" "$palforge/Configuration.cfg"

                  Set-Content "$palforge/Logs/.keep" ""
                  Set-Content "$palforge/Plugins/README.txt" "Place each plugin in its own folder here: Plugins\<Name>\<Name>.dll (with its <Name>.cfg beside it)."

            - name: Zip
              shell: pwsh
              run: Compress-Archive -Path "bundle/Win64/*" -DestinationPath "Palforge-${{ env.RELEASE_TAG }}-win-x64${{ matrix.suffix }}.zip"

            - name: Attach to the GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  files: Palforge-${{ env.RELEASE_TAG }}-win-x64${{ matrix.suffix }}.zip
                  generate_release_notes: true
